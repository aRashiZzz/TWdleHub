<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎵 pitchDle - 聽音猜音高節奏遊戲</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 🎹 鋼琴鍵盤樣式與響應式微調 */
        .piano-container {
            display: flex;
            justify-content: flex-start;
            position: relative;
            user-select: none;
            padding: 10px 0;
            overflow-x: auto;
            max-width: 100%;
            scroll-behavior: smooth;
        }

        .white-key {
            width: 36px;
            height: 160px;
            background: #f3f4f6;
            border: 1px solid #d1d5db;
            border-radius: 0 0 8px 8px;
            cursor: pointer;
            z-index: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding-bottom: 8px;
            color: #374151;
            font-weight: bold;
            font-size: 0.75rem;
            flex-shrink: 0;
            transition: background 0.1s, transform 0.05s;
        }

        .white-key:active {
            background: #e5e7eb;
            transform: translateY(2px);
        }

        .black-key {
            width: 24px;
            height: 100px;
            background: #111827;
            border: 1px solid #374151;
            border-radius: 0 0 6px 6px;
            cursor: pointer;
            z-index: 2;
            margin-left: -12px;
            margin-right: -12px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding-bottom: 6px;
            color: #9ca3af;
            font-weight: bold;
            font-size: 0.65rem;
            flex-shrink: 0;
            transition: background 0.1s, transform 0.05s;
        }

        .black-key:active {
            background: #1f2937;
            transform: translateY(2px);
        }

        @media (max-width: 640px) {
            .white-key { width: 30px; height: 130px; font-size: 0.65rem; }
            .black-key { width: 20px; height: 80px; margin-left: -10px; margin-right: -10px; font-size: 0.55rem; }
        }
    </style>
</head>
<body class="bg-gray-950 text-white min-h-screen flex flex-col items-center p-4 md:p-8">

    <!-- 頂部導覽列 -->
    <div class="w-full max-w-md md:max-w-2xl flex flex-wrap justify-between items-center gap-2 mb-4">
        <a href="./" class="text-sm text-pink-400 hover:underline transition flex items-center gap-1 w-fit">
            <span>←</span> 返回遊戲大廳
        </a>
        
        <div class="flex items-center gap-2">
            <!-- 每日 / 無限 模式選擇 -->
            <div class="bg-gray-900 border border-gray-800 p-1 rounded-xl flex gap-1 text-xs md:text-sm font-bold">
                <button id="mode-daily" onclick="pitchModule.switchMode('daily')" class="px-3 py-1.5 rounded-lg bg-pink-500 text-black transition-all">
                    📅 每日挑戰
                </button>
                <button id="mode-endless" onclick="pitchModule.switchMode('endless')" class="px-3 py-1.5 rounded-lg text-gray-400 hover:text-white transition-all">
                    ♾️ 無限遊玩
                </button>
            </div>

            <!-- 🔥 盲猜挑戰模式切換按鈕 -->
            <button id="hard-mode-btn" onclick="pitchModule.toggleHardMode()" 
                    class="px-3 py-2 rounded-xl text-xs md:text-sm font-bold border border-red-900/50 bg-gray-900 text-gray-400 hover:text-red-400 transition-all flex items-center gap-1">
                🔥 挑戰模式 (關)
            </button>
        </div>
    </div>

    <!-- 標題區 -->
    <header class="text-center mb-6">
        <h1 class="text-3xl md:text-5xl font-black tracking-wider text-pink-400 drop-shadow-[0_0_15px_rgba(244,114,182,0.2)]">
            🎵 pitchDle
        </h1>
        <p id="game-subtitle" class="text-gray-400 text-xs md:text-sm mt-2">猜出今天的神祕鋼琴單音（每日更新）</p>
    </header>

    <main class="w-full max-w-md md:max-w-3xl flex flex-col items-center gap-6">
        
        <!-- 音效播放與聽音面板 -->
        <div class="w-full bg-gray-900/60 border border-gray-800/80 rounded-2xl p-6 flex flex-col items-center gap-4 shadow-xl backdrop-blur-sm relative overflow-hidden">
            <div id="hard-badge" class="hidden absolute top-3 right-3 bg-red-600/30 border border-red-500/50 text-red-400 text-[10px] md:text-xs font-black px-2.5 py-1 rounded-full animate-pulse">
                🔥 挑戰模式：隱藏高低提示
            </div>

            <div class="text-xs text-pink-400 font-bold tracking-widest uppercase">Target Pitch (Range: C2 - B5)</div>
            
            <button id="play-target-btn" onclick="pitchModule.playTargetAudio()" 
                    class="bg-pink-500 hover:bg-pink-600 text-black font-black text-lg md:text-xl px-8 py-4 rounded-2xl transition-all shadow-[0_0_20px_rgba(244,114,182,0.3)] active:scale-95 flex items-center gap-3">
                <span class="text-2xl">🔊</span> 點擊聽神祕單音
            </button>
            
            <p class="text-xs text-gray-400">可無限次點擊重聽。下方可左右滑動琴鍵選擇音高作答！</p>
        </div>

        <!-- 鋼琴鍵盤區（含音域快速跳轉頁籤） -->
        <div class="w-full bg-gray-900/40 border border-gray-800/80 rounded-2xl p-4 shadow-xl">
            <div class="flex justify-between items-center mb-3">
                <div class="text-xs font-bold text-gray-400">👇 快速切換音域視角：</div>
                <div class="flex gap-1 text-xs font-bold">
                    <button onclick="pitchModule.scrollToOctave(2)" class="px-2.5 py-1 rounded-lg bg-gray-800 hover:bg-gray-700 text-gray-300 border border-gray-700">低音區 (C2-B3)</button>
                    <button onclick="pitchModule.scrollToOctave(4)" class="px-2.5 py-1 rounded-lg bg-gray-800 hover:bg-gray-700 text-gray-300 border border-gray-700">高音區 (C4-B5)</button>
                </div>
            </div>

            <div id="piano-keyboard" class="piano-container"></div>
        </div>

        <!-- 歷史猜測清單 -->
        <div class="w-full bg-gray-900/40 p-4 md:p-5 rounded-2xl border border-gray-800/80 backdrop-blur-sm shadow-xl">
            <h3 class="font-bold text-xs md:text-sm text-gray-400 border-b border-gray-800 pb-2 mb-3">📊 猜測紀錄 (最多 6 次)</h3>
            <div id="history-container" class="flex flex-col gap-2"></div>
        </div>

        <!-- 遊戲說明面板 -->
        <div class="w-full bg-gray-900/60 border border-gray-800/80 rounded-2xl p-4 text-xs text-gray-400 flex flex-col gap-2 shadow-md">
            <h3 class="font-bold text-gray-200 border-b border-gray-800 pb-2">💡 遊戲說明與圖例提示</h3>
            <div class="flex items-center gap-2">
                <span class="bg-green-600 text-white font-bold px-2 py-0.5 rounded">綠色</span>
                <span>：完全正確（該音高與目標單音完全吻合）。</span>
            </div>
            <div id="hint-desc-normal" class="flex flex-col gap-2">
                <div class="flex items-center gap-2">
                    <span class="bg-yellow-500 text-black font-bold px-2 py-0.5 rounded">黃色 ↑</span>
                    <span>：你按的音太低了！目標神祕音高比這個音更高。</span>
                </div>
                <div class="flex items-center gap-2">
                    <span class="bg-blue-600 text-white font-bold px-2 py-0.5 rounded">藍色 ↓</span>
                    <span>：你按的音太高了！目標神祕音高比這個音更低。</span>
                </div>
            </div>
            <div id="hint-desc-hard" class="hidden flex items-center gap-2 text-red-400 font-bold">
                <span class="bg-red-800 text-white font-bold px-2 py-0.5 rounded">灰色 ❌</span>
                <span>：挑戰模式開啟中！猜錯僅顯示不正確，不會提供任何音高方向指示。</span>
            </div>
        </div>

        <!-- 結算視窗 (Modal) -->
        <div id="result-modal" class="fixed inset-0 bg-black/80 flex items-center justify-center p-4 hidden z-50 backdrop-blur-md">
            <div class="bg-gray-900 border-2 border-gray-800 rounded-2xl p-6 md:p-8 w-full max-w-sm text-center shadow-2xl">
                <h2 id="modal-title" class="text-3xl font-black text-pink-400">🎉 任務成功！</h2>
                <p id="modal-desc" class="text-gray-300 mt-2 text-sm md:text-base"></p>
                <div id="emoji-preview" class="my-4 font-mono text-sm leading-tight bg-gray-950 p-4 rounded-xl border border-gray-800 select-all max-h-40 overflow-y-auto"></div>
                
                <div class="flex flex-col gap-2">
                    <button id="share-btn" class="w-full bg-pink-500 hover:bg-pink-600 text-black font-black py-3 rounded-xl transition shadow-lg">
                        📋 複製戰績（分享到 Threads/脆）
                    </button>
                    <button id="next-game-btn" onclick="pitchModule.startNewGame()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-black py-3 rounded-xl transition shadow-lg hidden">
                        🔄 再玩一場
                    </button>
                </div>
                
                <button onclick="pitchModule.closeModal()" class="mt-4 text-xs text-gray-500 hover:text-gray-300 block mx-auto">關閉視窗</button>
            </div>
        </div>

    </main>

    <script>
        const pitchModule = (function() {
            // 🎹 4 個八度音符設定 ($C2$ 到 $B5$，共 48 個半音鍵)
            const octaves = [2, 3, 4, 5];
            const baseNotes = [
                { name: "C", freq: 65.41, type: "white" },
                { name: "C#", freq: 69.30, type: "black" },
                { name: "D", freq: 73.42, type: "white" },
                { name: "D#", freq: 77.78, type: "black" },
                { name: "E", freq: 82.41, type: "white" },
                { name: "F", freq: 87.31, type: "white" },
                { name: "F#", freq: 92.50, type: "black" },
                { name: "G", freq: 98.00, type: "white" },
                { name: "G#", freq: 103.83, type: "black" },
                { name: "A", freq: 110.00, type: "white" },
                { name: "A#", freq: 116.54, type: "black" },
                { name: "B", freq: 123.47, type: "white" }
            ];

            const NOTES = [];
            octaves.forEach(oct => {
                const multiplier = Math.pow(2, oct - 2);
                baseNotes.forEach(b => {
                    NOTES.push({
                        name: `${b.name}${oct}`,
                        freq: Number((b.freq * multiplier).toFixed(2)),
                        type: b.type,
                        octave: oct
                    });
                });
            });

            let targetNote = null;
            let targetIndex = -1;
            let guessHistory = [];
            let isGameOver = false;
            let currentGameMode = 'daily';
            let isHardMode = false;
            let audioCtx = null;

            function getAudioContext() {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                return audioCtx;
            }

            function playPitch(freq) {
                const ctx = getAudioContext();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();

                osc.type = 'triangle';
                osc.frequency.setValueAtTime(freq, ctx.currentTime);

                gain.gain.setValueAtTime(0.8, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 1.5);

                osc.connect(gain);
                gain.connect(ctx.destination);

                osc.start();
                osc.stop(ctx.currentTime + 1.5);
            }

            function getHashCode(str) {
                let hash = 0;
                for (let i = 0; i < str.length; i++) {
                    hash = (hash << 5) - hash + str.charCodeAt(i);
                    hash |= 0;
                }
                return Math.abs(hash);
            }

            function renderPianoKeys() {
                const keyboard = document.getElementById('piano-keyboard');
                keyboard.innerHTML = '';

                NOTES.forEach((note, index) => {
                    const keyBtn = document.createElement('div');
                    keyBtn.className = note.type === 'white' ? 'white-key' : 'black-key';
                    keyBtn.innerText = note.name;
                    keyBtn.id = `key-${note.name}`;

                    keyBtn.addEventListener('click', () => {
                        playPitch(note.freq);
                        if (!isGameOver) {
                            handleGuess(index);
                        }
                    });

                    keyboard.appendChild(keyBtn);
                });
            }

            // 滾動導覽至指定八度
            function scrollToOctave(oct) {
                const targetKey = document.getElementById(`key-C${oct}`);
                if (targetKey) {
                    targetKey.scrollIntoView({ behavior: 'smooth', inline: 'start', block: 'nearest' });
                }
            }

            function startNewGame() {
                closeModal();
                guessHistory = [];
                isGameOver = false;
                document.getElementById('history-container').innerHTML = '';

                if (currentGameMode === 'daily') {
                    const todayStr = new Date().toISOString().slice(0, 10);
                    const seed = getHashCode("pitch_v2_" + todayStr);
                    targetIndex = seed % NOTES.length;
                    document.getElementById('game-subtitle').innerText = "猜出今天的神祕鋼琴單音 (範圍 C2 - B5)";
                } else {
                    targetIndex = Math.floor(Math.random() * NOTES.length);
                    document.getElementById('game-subtitle').innerText = "無限遊玩模式：神祕單音已隨機重置！";
                }

                targetNote = NOTES[targetIndex];
                console.log("今日神祕單音（防作弊隱蔽）：", targetNote.name);

                // 預設將鍵盤視野滾動到中央 C4 區間
                setTimeout(() => scrollToOctave(3), 300);
            }

            function playTargetAudio() {
                if (targetNote) {
                    playPitch(targetNote.freq);
                }
            }

            function toggleHardMode() {
                isHardMode = !isHardMode;
                const hardBtn = document.getElementById('hard-mode-btn');
                const hardBadge = document.getElementById('hard-badge');
                const normalDesc = document.getElementById('hint-desc-normal');
                const hardDesc = document.getElementById('hint-desc-hard');

                if (isHardMode) {
                    hardBtn.className = "px-3 py-2 rounded-xl text-xs md:text-sm font-bold border border-red-500 bg-red-600 text-white transition-all shadow-[0_0_12px_rgba(239,68,68,0.5)] flex items-center gap-1 active:scale-95";
                    hardBtn.innerText = "🔥 挑戰模式 (開)";
                    hardBadge.classList.remove('hidden');
                    normalDesc.classList.add('hidden');
                    hardDesc.classList.remove('hidden');
                } else {
                    hardBtn.className = "px-3 py-2 rounded-xl text-xs md:text-sm font-bold border border-red-900/50 bg-gray-900 text-gray-400 hover:text-red-400 transition-all flex items-center gap-1";
                    hardBtn.innerText = "🔥 挑戰模式 (關)";
                    hardBadge.classList.add('hidden');
                    normalDesc.classList.remove('hidden');
                    hardDesc.classList.add('hidden');
                }
                startNewGame();
            }

            function handleGuess(guessIdx) {
                if (isGameOver) return;
                const guessNote = NOTES[guessIdx];

                let colorClass = "bg-green-600 text-white";
                let hintText = "正確 🟩";
                let emoji = "🟩";

                if (guessIdx === targetIndex) {
                    colorClass = "bg-green-600 text-white";
                    hintText = "正確 🟩";
                    emoji = "🟩";
                } else {
                    if (isHardMode) {
                        colorClass = "bg-gray-800 border border-red-900/40 text-red-400";
                        hintText = "不正確 ❌";
                        emoji = "⬛";
                    } else {
                        if (guessIdx < targetIndex) {
                            colorClass = "bg-yellow-500 text-black";
                            hintText = "太低了 ↑ (目標更高)";
                            emoji = "🟨";
                        } else {
                            colorClass = "bg-blue-600 text-white";
                            hintText = "太高了 ↓ (目標更低)";
                            emoji = "🟦";
                        }
                    }
                }

                guessHistory.push({ note: guessNote.name, emoji: emoji, hintText: hintText });

                const row = document.createElement('div');
                row.className = `flex justify-between items-center p-3 rounded-xl font-bold ${colorClass} transition-all duration-300 shadow-md`;
                row.innerHTML = `
                    <span class="text-base">${guessNote.name}</span>
                    <span class="text-sm">${hintText}</span>
                `;
                document.getElementById('history-container').prepend(row);

                if (guessIdx === targetIndex) {
                    isGameOver = true;
                    showResult(true);
                } else if (guessHistory.length >= 6) {
                    isGameOver = true;
                    showResult(false);
                }
            }

            function showResult(isWin) {
                const title = document.getElementById('modal-title');
                title.innerText = isWin ? (isHardMode ? "🔥 絕對音感大師！" : "🎉 完美的音感！") : "💥 挑戰失敗！";
                title.className = isWin ? "text-3xl font-black text-pink-400" : "text-3xl font-black text-red-500";

                document.getElementById('modal-desc').innerText = isWin
                    ? `你花了 ${guessHistory.length} 次猜出正確音高：${targetNote.name}！`
                    : `可惜了！今天的正確音高是：${targetNote.name}`;

                const todayStrTW = new Date().toLocaleDateString('zh-TW');
                const modeTag = currentGameMode === 'daily' ? '每日挑戰' : '無限遊玩';
                const hardTag = isHardMode ? ' 🔥盲猜挑戰' : '';

                let emojiText = `📊 pitchDle 聽音猜音高 (${modeTag}${hardTag}) #${todayStrTW}\n`;
                emojiText += `音域: C2 - B5 (48音) | 次數: ${guessHistory.length}/6\n\n`;

                guessHistory.forEach(g => { emojiText += `${g.emoji} ${g.note}\n`; });
                emojiText += `\n點此挑戰音感 👉 ${window.location.href}`;

                const emojiPreview = document.getElementById('emoji-preview');
                emojiPreview.innerText = emojiText.replace(/\n/g, '\r\n');

                const shareBtn = document.getElementById('share-btn');
                shareBtn.onclick = function() {
                    navigator.clipboard.writeText(emojiText).then(() => {
                        shareBtn.innerText = "✅ 複製成功！快去發脆吧！";
                        setTimeout(() => { shareBtn.innerText = "📋 複製戰績（分享到 Threads/脆）"; }, 2000);
                    });
                };

                setTimeout(() => {
                    document.getElementById('result-modal').classList.remove('hidden');
                }, 600);
            }

            function switchMode(mode) {
                if (currentGameMode === mode) return;
                currentGameMode = mode;

                const dailyBtn = document.getElementById('mode-daily');
                const endlessBtn = document.getElementById('mode-endless');
                const nextGameBtn = document.getElementById('next-game-btn');

                if (mode === 'daily') {
                    dailyBtn.className = "px-3 py-1.5 rounded-lg bg-pink-500 text-black transition-all";
                    endlessBtn.className = "px-3 py-1.5 rounded-lg text-gray-400 hover:text-white transition-all";
                    nextGameBtn.classList.add('hidden');
                } else {
                    endlessBtn.className = "px-3 py-1.5 rounded-lg bg-pink-500 text-black transition-all";
                    dailyBtn.className = "px-3 py-1.5 rounded-lg text-gray-400 hover:text-white transition-all";
                    nextGameBtn.classList.remove('hidden');
                }
                startNewGame();
            }

            function closeModal() {
                document.getElementById('result-modal').classList.add('hidden');
            }

            // 初始化
            renderPianoKeys();
            startNewGame();

            return {
                playTargetAudio: playTargetAudio,
                toggleHardMode: toggleHardMode,
                scrollToOctave: scrollToOctave,
                switchMode: switchMode,
                startNewGame: startNewGame,
                closeModal: closeModal
            };
        })();
    </script>
</body>
</html>
